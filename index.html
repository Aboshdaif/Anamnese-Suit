<!DOCTYPE html>
<!--
================================================================================
ANAMNESE SUITE - Offline Medical History Application
================================================================================
Version: 2.1.0
Release Date: 2025-12-05
Authors: DiggAi GmbH / Laith Alshdaifat
Medical Content: Dr. Christian Klapproth

REGULATORY COMPLIANCE:
- DSGVO/GDPR Art. 5, 6, 9, 32: Privacy by Design, Data Minimization
- FHIR R5: HL7 Standard for Healthcare Interoperability (https://hl7.org/fhir/R5/)
- ISO 27001: Information Security Management
- MDR 2017/745: Medical Device Regulation (informational purposes only)

TECHNICAL DOCUMENTATION:
- All data processed in RAM only by default
- Optional local storage with explicit user consent (GDPR Art. 6(1)(a))
- NFC NDEF export with MIME type application/json, max 4KB payload
- QR-Code and JSON download as fallback options
- Automatic data wipe after export or 10-minute inactivity timeout
- 15 languages with RTL support for Arabic, Farsi, Kurdish
- Web Speech API for cross-platform voice input
- Input validation for required fields

VERSIONING:
- v2.1.0 (2025-12-05): Voice input, validation, save/restore, reset functionality
- v2.0.0 (2025-12-05): Senior-friendly design, enhanced accessibility, full Q-code structure
- v1.0.0 (2025-12-04): Initial release with basic sections

LICENSE: Proprietary - DiggAi GmbH - All rights reserved
================================================================================
-->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0">
  <title>Anamnese Suite v2.1 - Offline Medical History</title>
  <meta name="description" content="FHIR R5 compliant offline medical anamnesis with 15 languages, NFC export, GDPR compliant">
  <meta name="author" content="DiggAi GmbH / Laith Alshdaifat">
  <meta name="version" content="2.1.0">
  <style>
    /* ================================================================
       CSS VARIABLES - Senior-Friendly Design (WCAG AA compliant)
       Enhanced contrast, larger fonts, bigger touch targets
       ================================================================ */
    :root {
      /* Primary Colors - High Contrast for better readability */
      --primary: #0056b3;
      --primary-dark: #003d82;
      --primary-light: #4a90d9;
      /* Status Colors */
      --success: #1a7f37;
      --warning: #9a6700;
      --danger: #cf222e;
      /* Background & Text - High Contrast */
      --bg: #ffffff;
      --bg-secondary: #f6f8fa;
      --card-bg: #ffffff;
      --text: #1f2328;
      --text-secondary: #57606a;
      --border: #d0d7de;
      /* Shadows */
      --shadow: 0 3px 12px rgba(0,0,0,0.12);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-secondary);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      padding-bottom: 240px;
      font-size: 18px; /* Larger base font for seniors */
    }
    .container { max-width: 900px; margin: 0 auto; padding: 1.25rem; }
    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 1.25rem;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow);
    }
    header h1 { font-size: 1.75rem; margin-bottom: 0.5rem; font-weight: 700; }
    .language-selector { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin: 0.75rem 0; }
    .lang-btn {
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.5);
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s;
      min-width: 70px;
    }
    .lang-btn:hover, .lang-btn.active { background: white; color: var(--primary); border-color: white; }
    .progress-bar { background: rgba(255,255,255,0.3); height: 12px; border-radius: 6px; margin-top: 0.75rem; overflow: hidden; }
    .progress-fill { background: linear-gradient(90deg, #4ade80 0%, #22c55e 100%); height: 100%; width: 0%; transition: width 0.3s; border-radius: 6px; }
    .progress-text { font-size: 1rem; margin-top: 0.4rem; font-weight: 600; }
    .card { background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow); padding: 2rem; margin-bottom: 1.25rem; border: 1px solid var(--border); }
    .card-title { font-size: 1.5rem; color: var(--primary); margin-bottom: 1.25rem; padding-bottom: 0.75rem; border-bottom: 3px solid var(--primary); }
    .form-group { margin-bottom: 1.75rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 0.75rem; font-size: 1.1rem; }
    .form-group label.required::after { content: " *"; color: var(--danger); font-weight: 700; }
    input[type="text"], input[type="date"], input[type="number"], input[type="email"], select, textarea {
      width: 100%; padding: 1rem; border: 2px solid var(--border); border-radius: 8px; font-size: 1.1rem;
      background: var(--card-bg); color: var(--text); transition: border-color 0.2s, box-shadow 0.2s;
      min-height: 54px;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0,86,179,0.2); }
    .options-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .options-list label {
      display: flex; align-items: center; padding: 1rem 1.25rem; border: 2px solid var(--border);
      border-radius: 8px; cursor: pointer; transition: all 0.2s; font-weight: 500; font-size: 1.05rem;
      min-height: 56px; background: var(--bg);
    }
    .options-list label:hover { background: rgba(0,86,179,0.05); border-color: var(--primary-light); }
    .options-list label.selected { background: rgba(0,86,179,0.1); border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,86,179,0.15); }
    .options-list input { margin-right: 14px; width: 22px; height: 22px; accent-color: var(--primary); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 1rem 1.75rem; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s; min-width: 140px; min-height: 54px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: var(--shadow); }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-secondary { background: var(--text-secondary); color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .section { display: none; }
    .section.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .nav-buttons { display: flex; justify-content: space-between; gap: 1rem; margin-top: 2rem; padding-top: 1.25rem; border-top: 2px solid var(--border); }
    .alert { padding: 1.25rem; border-radius: 8px; margin-bottom: 1.25rem; display: flex; align-items: flex-start; gap: 1rem; font-size: 1.05rem; }
    .alert-warning { background: #fef3c7; border: 2px solid #f59e0b; color: #92400e; }
    .alert-info { background: #dbeafe; border: 2px solid #3b82f6; color: #1e40af; }
    .alert-danger { background: #fee2e2; border: 2px solid #ef4444; color: #991b1b; }
    .hidden { display: none !important; }
    .consent-modal, .export-modal {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 1.25rem;
    }
    .modal-content { background: white; border-radius: 16px; max-width: 700px; max-height: 90vh; overflow-y: auto; padding: 2.5rem; box-shadow: var(--shadow-lg); }
    .modal-content h2 { color: var(--primary); margin-bottom: 1.25rem; font-size: 1.5rem; }
    .modal-content h3 { color: var(--text); font-size: 1.2rem; margin: 1.25rem 0 0.75rem 0; }
    .modal-content ul { margin: 1rem 0; padding-left: 1.75rem; }
    .modal-content li { margin-bottom: 0.75rem; line-height: 1.6; }
    .red-flag { background: #fff5f5; border-left: 5px solid var(--danger); padding: 1.25rem; margin: 1.25rem 0; border-radius: 0 8px 8px 0; }
    .red-flag-title { color: var(--danger); font-weight: 700; margin-bottom: 0.5rem; font-size: 1.1rem; }

    /* Answer Summary Box - Enhanced for seniors */
    .answer-summary {
      position: fixed; bottom: 0; left: 0; right: 0; background: white;
      border-top: 4px solid var(--primary); box-shadow: 0 -6px 20px rgba(0,0,0,0.15);
      z-index: 99; max-height: 220px; transition: max-height 0.3s;
    }
    .answer-summary.collapsed { max-height: 56px; }
    .answer-summary-header {
      background: var(--primary); color: white; padding: 1rem 1.25rem;
      display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    }
    .answer-summary-header h3 { font-size: 1.05rem; margin: 0; display: flex; align-items: center; gap: 0.5rem; }
    .answer-summary-toggle { background: none; border: none; color: white; font-size: 1.4rem; cursor: pointer; transition: transform 0.3s; padding: 0.25rem; }
    .answer-summary.collapsed .answer-summary-toggle { transform: rotate(180deg); }
    .answer-summary-content { padding: 1rem 1.25rem; overflow-y: auto; max-height: 165px; }
    .answer-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.75rem 1rem; margin-bottom: 0.6rem; background: var(--bg-secondary);
      border-radius: 8px; cursor: pointer; transition: background 0.2s; font-size: 0.95rem; border: 2px solid transparent;
    }
    .answer-item:hover { background: rgba(0,86,179,0.1); border-color: var(--primary-light); }
    .answer-item-q { color: var(--text-secondary); font-size: 0.9rem; flex: 1; }
    .answer-item-a { font-weight: 600; color: var(--text); max-width: 55%; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .answer-item-edit { color: var(--primary); font-size: 1rem; margin-left: 0.75rem; }
    .no-answers { color: var(--text-secondary); font-style: italic; text-align: center; padding: 1.25rem; }

    .timeout-warning {
      position: fixed; bottom: 240px; right: 1.25rem; background: #fbbf24; color: #78350f;
      padding: 1.25rem 1.75rem; border-radius: 10px; box-shadow: var(--shadow-lg); z-index: 999;
      display: flex; align-items: center; gap: 1rem; font-weight: 600; font-size: 1.05rem;
    }
    .export-options { display: flex; flex-direction: column; gap: 1.25rem; margin: 1.75rem 0; }
    .nfc-status { padding: 2rem; background: var(--bg-secondary); border-radius: 12px; margin: 1.25rem 0; text-align: center; }
    .nfc-icon { font-size: 4rem; margin-bottom: 0.75rem; }

    /* Validation Styles */
    .form-group.invalid input,
    .form-group.invalid select,
    .form-group.invalid textarea {
      border-color: var(--danger);
      background: #fff5f5;
    }
    .form-group .error-message {
      color: var(--danger);
      font-size: 0.9rem;
      margin-top: 0.5rem;
      display: none;
    }
    .form-group.invalid .error-message {
      display: block;
    }
    
    /* Voice Input Button */
    .voice-btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      transition: all 0.2s;
      margin-left: 0.5rem;
    }
    .voice-btn:hover { background: var(--primary-dark); transform: scale(1.05); }
    .voice-btn.recording { background: var(--danger); animation: pulse 1s infinite; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    .voice-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .input-with-voice {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .input-with-voice input,
    .input-with-voice textarea {
      flex: 1;
    }
    
    /* Save/Restore Panel */
    .data-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: var(--shadow-lg);
      z-index: 1001;
      max-width: 500px;
      width: 90%;
    }
    .data-panel h3 { color: var(--primary); margin-bottom: 1rem; }
    .data-panel .panel-actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    
    /* Header Actions */
    .header-actions {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }
    .header-btn {
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.5);
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .header-btn:hover { background: white; color: var(--primary); border-color: white; }
    .header-btn.danger { border-color: #ff6b6b; }
    .header-btn.danger:hover { background: #ff6b6b; color: white; }
    
    /* Voice Status Indicator */
    .voice-status {
      position: fixed;
      bottom: 260px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary);
      color: white;
      padding: 1rem 1.5rem;
      border-radius: 10px;
      box-shadow: var(--shadow-lg);
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 600;
    }
    .voice-status.hidden { display: none; }
    .voice-status .voice-indicator {
      width: 12px;
      height: 12px;
      background: #ff6b6b;
      border-radius: 50%;
      animation: pulse 1s infinite;
    }

    /* Responsive - Mobile optimized */
    @media (max-width: 768px) {
      body { font-size: 16px; }
      .container { padding: 0.75rem; }
      .card { padding: 1.5rem; }
      header { padding: 1rem; }
      header h1 { font-size: 1.4rem; }
      .lang-btn { padding: 6px 10px; font-size: 0.8rem; min-width: 55px; }
      .btn { padding: 0.85rem 1.25rem; font-size: 1rem; min-width: 110px; }
      .answer-summary { max-height: 200px; }
      .answer-summary-content { max-height: 145px; }
      .header-actions { gap: 0.4rem; }
      .header-btn { padding: 6px 12px; font-size: 0.75rem; }
      .voice-btn { width: 42px; height: 42px; font-size: 1.2rem; }
    }
    
    /* RTL Support - Arabic, Farsi, Kurdish */
    [dir="rtl"] { text-align: right; }
    [dir="rtl"] .options-list input { margin-right: 0; margin-left: 14px; }
    [dir="rtl"] .answer-item { flex-direction: row-reverse; }
    [dir="rtl"] .answer-item-a { text-align: left; }
    [dir="rtl"] .answer-item-edit { margin-left: 0; margin-right: 0.75rem; }
    [dir="rtl"] .red-flag { border-left: none; border-right: 5px solid var(--danger); border-radius: 8px 0 0 8px; }
    [dir="rtl"] .modal-content ul { padding-left: 0; padding-right: 1.75rem; }
    [dir="rtl"] .voice-btn { margin-left: 0; margin-right: 0.5rem; }
    
    /* High Contrast Mode */
    @media (prefers-contrast: high) {
      :root { --border: #000000; --text-secondary: #333333; }
      .options-list label { border-width: 3px; }
      input, select, textarea { border-width: 3px; }
    }
    
    /* Focus visible for accessibility */
    :focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <!-- Consent Modal -->
  <div id="consentModal" class="consent-modal">
    <div class="modal-content">
      <h2 data-i18n="consent.title"></h2>
      <p data-i18n="consent.intro"></p>
      <h3 data-i18n="consent.purpose"></h3>
      <p data-i18n="consent.purposeText"></p>
      <h3 data-i18n="consent.dataHandling"></h3>
      <ul>
        <li data-i18n="consent.noStorage"></li>
        <li data-i18n="consent.noTracking"></li>
        <li data-i18n="consent.autoDelete"></li>
        <li data-i18n="consent.nfcTransfer"></li>
      </ul>
      <h3 data-i18n="consent.rights"></h3>
      <ul>
        <li data-i18n="consent.rightAccess"></li>
        <li data-i18n="consent.rightRectification"></li>
        <li data-i18n="consent.rightErasure"></li>
        <li data-i18n="consent.rightWithdraw"></li>
      </ul>
      <p data-i18n="consent.contact"></p>
      <div style="text-align: center; margin-top: 1.5rem;">
        <button class="btn btn-primary" onclick="acceptConsent()" data-i18n="consent.accept"></button>
      </div>
    </div>
  </div>

  <!-- Timeout Warning -->
  <div id="timeoutWarning" class="timeout-warning hidden">
    <span data-i18n="timeout.warning"></span> <span id="timeoutCounter">60</span>s
    <button class="btn btn-primary" onclick="resetTimeout()" style="margin-left: 1rem;" data-i18n="timeout.continue"></button>
  </div>

  <!-- Header -->
  <header>
    <h1 data-i18n="app.title"></h1>
    <p data-i18n="app.subtitle"></p>
    <div class="language-selector">
      <button class="lang-btn active" data-lang="de">Deutsch</button>
      <button class="lang-btn" data-lang="en">English</button>
      <button class="lang-btn" data-lang="tr">Türkçe</button>
      <button class="lang-btn" data-lang="ru">Русский</button>
      <button class="lang-btn" data-lang="ar">العربية</button>
      <button class="lang-btn" data-lang="ku">Kurdî</button>
      <button class="lang-btn" data-lang="pl">Polski</button>
      <button class="lang-btn" data-lang="ro">Română</button>
      <button class="lang-btn" data-lang="it">Italiano</button>
      <button class="lang-btn" data-lang="fr">Français</button>
      <button class="lang-btn" data-lang="es">Español</button>
      <button class="lang-btn" data-lang="bg">Български</button>
      <button class="lang-btn" data-lang="nl">Nederlands</button>
      <button class="lang-btn" data-lang="fa">فارسی</button>
      <button class="lang-btn" data-lang="uk">Українська</button>
    </div>
    <div class="header-actions">
      <button class="header-btn" onclick="showDataPanel('save')" title="Zwischenspeichern">💾 <span data-i18n="btn.save"></span></button>
      <button class="header-btn" onclick="showDataPanel('restore')" title="Wiederherstellen">📂 <span data-i18n="btn.restore"></span></button>
      <button class="header-btn" onclick="saveBaseData()" title="Stammdaten speichern">👤 <span data-i18n="btn.saveBaseData"></span></button>
      <button class="header-btn" onclick="loadBaseData()" title="Stammdaten laden">📥 <span data-i18n="btn.loadBaseData"></span></button>
      <button class="header-btn danger" onclick="resetForm()" title="Zurücksetzen">🔄 <span data-i18n="btn.reset"></span></button>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text"><span id="progressText">0</span>% <span data-i18n="progress.complete"></span></div>
  </header>

  <!-- Voice Status Indicator -->
  <div id="voiceStatus" class="voice-status hidden">
    <div class="voice-indicator"></div>
    <span data-i18n="voice.listening"></span>
  </div>

  <div class="container" id="mainContainer" style="display: none;">
    <!-- Sections will be dynamically generated -->
  </div>

  <!-- Answer Summary Box -->
  <div id="answerSummary" class="answer-summary collapsed hidden">
    <div class="answer-summary-header" onclick="toggleAnswerSummary()">
      <h3><span data-i18n="summary.title"></span> (<span id="answerCount">0</span>)</h3>
      <button class="answer-summary-toggle" id="summaryToggle">▲</button>
    </div>
    <div class="answer-summary-content" id="answerSummaryContent">
      <div class="no-answers" data-i18n="summary.empty"></div>
    </div>
  </div>

  <!-- Export Modal -->
  <div id="exportModal" class="export-modal hidden">
    <div class="modal-content" style="text-align: center;">
      <h2 data-i18n="export.title"></h2>
      <p data-i18n="export.instruction"></p>
      <div class="nfc-status" id="nfcStatus">
        <div class="nfc-icon">📡</div>
        <p id="nfcStatusText" data-i18n="nfc.ready"></p>
      </div>
      <div class="export-options">
        <button class="btn btn-primary" onclick="exportNFC()" id="nfcButton" data-i18n="export.nfc"></button>
        <button class="btn btn-secondary" onclick="exportQR()" data-i18n="export.qr"></button>
        <button class="btn btn-secondary" onclick="downloadJSON()" data-i18n="export.download"></button>
      </div>
      <button class="btn btn-danger" onclick="cancelExport()" style="margin-top: 1rem;" data-i18n="export.cancel"></button>
    </div>
  </div>

  <script>
    // ================================================================
    // ANAMNESE SUITE - Application Core
    // Version: 2.1.0 | Date: 2025-12-05
    // FHIR R5 Compliant | GDPR/DSGVO Compliant | NFC Export
    // ================================================================
    
    // Application Metadata
    const APP_VERSION = '2.1.0';
    const APP_DATE = '2025-12-05';
    const FHIR_QUESTIONNAIRE_URL = 'https://anamnese-suite.local/fhir/Questionnaire/anamnese-suite';
    
    // ============================================================
    // LABELS: All translations organized by key with all 15 languages
    // Structure: { key: { de, en, tr, ru, ar, ku, pl, ro, it, fr, es, bg, nl, fa, uk } }
    // ============================================================

      "save.consent": {de:"Lokale Speicherung (DSGVO Art. 6 Abs. 1a - Einwilligung)",en:"Local storage (GDPR Art. 6(1)(a) - Consent)",tr:"Yerel depolama (KVKK onayı)",ru:"Локальное хранение (GDPR - согласие)",ar:"التخزين المحلي (GDPR - موافقة)",ku:"Tomarkirina herêmî (GDPR - razîbûn)",pl:"Pamięć lokalna (RODO - zgoda)",ro:"Stocare locală (GDPR - consimțământ)",it:"Archiviazione locale (GDPR - consenso)",fr:"Stockage local (RGPD - consentement)",es:"Almacenamiento local (RGPD - consentimiento)",bg:"Локално съхранение (GDPR - съгласие)",nl:"Lokale opslag (AVG - toestemming)",fa:"ذخیره‌سازی محلی (GDPR - رضایت)",uk:"Локальне зберігання (GDPR - згода)"},
    };

    // ============================================================
    // QUESTIONNAIRE STRUCTURE with Q-codes
    // ============================================================
    const SECTIONS = [
      {
        id: "q0000", fields: [
          { qcode: "q0000", type: "text", required: true },
          { qcode: "q0001", type: "text", required: true },
          { qcode: "q0002", type: "select", options: ["q0002.m", "q0002.w", "q0002.d"], required: true },
          { qcode: "q0003", type: "date", required: true }
        ]
      },
      {
        id: "q1000", fields: [
          { qcode: "q1000", type: "radio", options: ["yes", "no"], required: true },
          { qcode: "q1001", type: "select", options: ["q1001.days", "q1001.weeks", "q1001.months", "q1001.years"], showIf: { q1000: "yes" } },
          { qcode: "q1002", type: "text", showIf: { q1000: "yes" } },
          { qcode: "q1003", type: "text", showIf: { q1000: "yes" } },
          { qcode: "q1005", type: "checkbox", options: ["q1005.fever", "q1005.fatigue", "q1005.nightsweats", "q1005.weightloss"], showIf: { q1000: "yes" } }
        ]
      },
      {
        id: "q2000", fields: [
          { qcode: "q2000", type: "checkbox", options: ["q2000.angio", "q2000.resp", "q2000.cardio", "q2000.gi", "q2000.uro", "q2000.msk", "q2000.neuro", "q2000.skin", "q2000.psych", "q2000.ent", "q2000.eyes"] }
        ]
      },
      {
        id: "q3000", fields: [
          { qcode: "q3000", type: "textarea" },
          { qcode: "q3001", type: "radio", options: ["yes", "no", "unknown"] }
        ]
      },
      {
        id: "q4000", fields: [
          { qcode: "q4000", type: "checkbox", options: ["q4000.heart", "q4000.stroke", "q4000.diabetes", "q4000.cancer"] }
        ]
      },
      {
        id: "q5000", fields: [
          { qcode: "q5000", type: "radio", options: ["q5000.never", "q5000.former", "q5000.current"] },
          { qcode: "q5001", type: "radio", options: ["q5001.never", "q5001.occasional", "q5001.regular"] }
        ]
      },
      {
        id: "q6000", fields: [
          { qcode: "q6000", type: "textarea" }
        ]
      }
    ];

    // ============================================================
    // STATE MANAGEMENT (RAM only)
    // ============================================================
    let state = {
      currentSection: 0,
      language: 'de',
      formData: {},
      isConsentGiven: false,
      isPediatric: false
    };
    let inactivityTimer, countdownTimer, countdownValue = 60;
    const TIMEOUT_MS = 600000; // 10 minutes

    // ============================================================
    // HELPER: Get translated label
    // ============================================================
    function t(key) {
      const entry = L[key];
      if (!entry) return key;
      return entry[state.language] || entry.de || key;
    }

    // ============================================================
    // INITIALIZATION
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      setupLanguageButtons();
      setupInactivityTimer();
      applyTranslations();
      buildSections();
    });

    function acceptConsent() {
      state.isConsentGiven = true;
      document.getElementById('consentModal').classList.add('hidden');
      document.getElementById('mainContainer').style.display = 'block';
      document.getElementById('answerSummary').classList.remove('hidden');
      updateProgress();
      showSection(0);
    }

    // ============================================================
    // LANGUAGE HANDLING
    // ============================================================
    function setupLanguageButtons() {
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.language = btn.dataset.lang;
          document.documentElement.lang = state.language;
          document.body.dir = ['ar', 'fa', 'ku'].includes(state.language) ? 'rtl' : 'ltr';
          applyTranslations();
          buildSections();
          showSection(state.currentSection);
          updateAnswerSummary();
        });
      });
    }

    function applyTranslations() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
    }

    // ============================================================
    // BUILD SECTIONS DYNAMICALLY
    // ============================================================
    function buildSections() {
      const container = document.getElementById('mainContainer');
      container.innerHTML = '';
      
      SECTIONS.forEach((section, idx) => {
        const sectionEl = document.createElement('section');
        sectionEl.className = 'section' + (idx === 0 ? ' active' : '');
        sectionEl.dataset.section = idx;
        
        const card = document.createElement('div');
        card.className = 'card';
        
        const title = document.createElement('h2');
        title.className = 'card-title';
        title.textContent = t('s.' + section.id);
        card.appendChild(title);
        
        section.fields.forEach(field => {
          const group = document.createElement('div');
          group.className = 'form-group';
          group.id = 'group-' + field.qcode;
          
          const label = document.createElement('label');
          if (field.required) label.className = 'required';
          label.textContent = t(field.qcode);
          group.appendChild(label);
          
          if (field.type === 'text') {
            const wrapper = document.createElement('div');
            wrapper.className = 'input-with-voice';
            
            const input = document.createElement('input');
            input.type = 'text';
            input.dataset.qcode = field.qcode;
            input.value = state.formData[field.qcode] || '';
            input.addEventListener('input', () => { 
              state.formData[field.qcode] = input.value; 
              updateAnswerSummary(); 
              // Clear validation error on input
              group.classList.remove('invalid');
              const err = group.querySelector('.error-message');
              if (err) err.remove();
            });
            wrapper.appendChild(input);
            
            // Add voice input button
            const voiceBtn = document.createElement('button');
            voiceBtn.type = 'button';
            voiceBtn.className = 'voice-btn';
            voiceBtn.innerHTML = '🎤';
            voiceBtn.title = t('btn.voice') || 'Spracheingabe';
            voiceBtn.onclick = () => startVoiceInput(input);
            wrapper.appendChild(voiceBtn);
            
            group.appendChild(wrapper);
          } else if (field.type === 'date') {
            const input = document.createElement('input');
            input.type = 'date';
            input.dataset.qcode = field.qcode;
            input.value = state.formData[field.qcode] || '';
            input.addEventListener('change', () => { state.formData[field.qcode] = input.value; checkAge(); updateAnswerSummary(); });
            group.appendChild(input);
          } else if (field.type === 'textarea') {
            const wrapper = document.createElement('div');
            wrapper.className = 'input-with-voice';
            wrapper.style.alignItems = 'flex-start';
            
            const textarea = document.createElement('textarea');
            textarea.rows = 3;
            textarea.dataset.qcode = field.qcode;
            textarea.value = state.formData[field.qcode] || '';
            textarea.addEventListener('input', () => { state.formData[field.qcode] = textarea.value; updateAnswerSummary(); });
            wrapper.appendChild(textarea);
            
            // Add voice input button
            const voiceBtn = document.createElement('button');
            voiceBtn.type = 'button';
            voiceBtn.className = 'voice-btn';
            voiceBtn.innerHTML = '🎤';
            voiceBtn.title = t('btn.voice') || 'Spracheingabe';
            voiceBtn.onclick = () => startVoiceInput(textarea);
            wrapper.appendChild(voiceBtn);
            
            group.appendChild(wrapper);
          } else if (field.type === 'select') {
            const select = document.createElement('select');
            select.dataset.qcode = field.qcode;
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = t('select.placeholder');
            select.appendChild(placeholder);
            field.options.forEach(opt => {
              const option = document.createElement('option');
              option.value = opt;
              option.textContent = t(opt);
              if (state.formData[field.qcode] === opt) option.selected = true;
              select.appendChild(option);
            });
            select.addEventListener('change', () => { state.formData[field.qcode] = select.value; applyBranching(); updateAnswerSummary(); });
            group.appendChild(select);
          } else if (field.type === 'radio') {
            const optionsList = document.createElement('div');
            optionsList.className = 'options-list';
            field.options.forEach(opt => {
              const optLabel = document.createElement('label');
              const radio = document.createElement('input');
              radio.type = 'radio';
              radio.name = field.qcode;
              radio.value = opt;
              radio.dataset.qcode = field.qcode;
              if (state.formData[field.qcode] === opt) radio.checked = true;
              radio.addEventListener('change', () => { 
                state.formData[field.qcode] = opt; 
                optionsList.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
                optLabel.classList.add('selected');
                applyBranching(); 
                updateAnswerSummary(); 
              });
              optLabel.appendChild(radio);
              optLabel.appendChild(document.createTextNode(t(opt)));
              if (state.formData[field.qcode] === opt) optLabel.classList.add('selected');
              optionsList.appendChild(optLabel);
            });
            group.appendChild(optionsList);
          } else if (field.type === 'checkbox') {
            const optionsList = document.createElement('div');
            optionsList.className = 'options-list';
            field.options.forEach(opt => {
              const optLabel = document.createElement('label');
              const cb = document.createElement('input');
              cb.type = 'checkbox';
              cb.value = opt;
              cb.dataset.qcode = field.qcode;
              const currentVals = state.formData[field.qcode] || [];
              if (currentVals.includes(opt)) { cb.checked = true; optLabel.classList.add('selected'); }
              cb.addEventListener('change', () => {
                let vals = state.formData[field.qcode] || [];
                if (cb.checked) { vals.push(opt); optLabel.classList.add('selected'); }
                else { vals = vals.filter(v => v !== opt); optLabel.classList.remove('selected'); }
                state.formData[field.qcode] = vals;
                updateAnswerSummary();
              });
              optLabel.appendChild(cb);
              optLabel.appendChild(document.createTextNode(t(opt)));
              optionsList.appendChild(optLabel);
            });
            group.appendChild(optionsList);
          }
          
          card.appendChild(group);
        });
        
        // Navigation buttons
        const navButtons = document.createElement('div');
        navButtons.className = 'nav-buttons';
        if (idx > 0) {
          const backBtn = document.createElement('button');
          backBtn.className = 'btn btn-secondary';
          backBtn.textContent = t('nav.back');
          backBtn.onclick = () => prevSection();
          navButtons.appendChild(backBtn);
        } else {
          navButtons.appendChild(document.createElement('div'));
        }
        if (idx < SECTIONS.length - 1) {
          const nextBtn = document.createElement('button');
          nextBtn.className = 'btn btn-primary';
          nextBtn.textContent = t('nav.next');
          nextBtn.onclick = () => nextSection();
          navButtons.appendChild(nextBtn);
        } else {
          const exportBtn = document.createElement('button');
          exportBtn.className = 'btn btn-success';
          exportBtn.textContent = t('nav.export');
          exportBtn.onclick = () => showExportModal();
          navButtons.appendChild(exportBtn);
        }
        card.appendChild(navButtons);
        
        sectionEl.appendChild(card);
        container.appendChild(sectionEl);
      });
      
      applyBranching();
    }

    // ============================================================
    // BRANCHING LOGIC
    // ============================================================
    function applyBranching() {
      SECTIONS.forEach(section => {
        section.fields.forEach(field => {
          if (field.showIf) {
            const group = document.getElementById('group-' + field.qcode);
            if (group) {
              let show = true;
              for (const [key, val] of Object.entries(field.showIf)) {
                if (state.formData[key] !== val) show = false;
              }
              group.style.display = show ? 'block' : 'none';
            }
          }
        });
      });
    }

    function checkAge() {
      const bd = state.formData['q0003'];
      if (!bd) return;
      const age = Math.floor((new Date() - new Date(bd)) / 31557600000);
      state.isPediatric = age < 16;
    }

    // ============================================================
    // NAVIGATION
    // ============================================================
    function nextSection() {
      // Validate current section before moving forward
      if (!validateSection(state.currentSection)) {
        return;
      }
      if (state.currentSection < SECTIONS.length - 1) {
        showSection(state.currentSection + 1);
      }
    }

    function prevSection() {
      if (state.currentSection > 0) {
        showSection(state.currentSection - 1);
      }
    }

    function showSection(idx) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelector(`[data-section="${idx}"]`)?.classList.add('active');
      state.currentSection = idx;
      updateProgress();
      window.scrollTo(0, 0);
      resetTimeout();
    }

    function goToQuestion(qcode) {
      // Find which section contains this qcode
      for (let i = 0; i < SECTIONS.length; i++) {
        for (const field of SECTIONS[i].fields) {
          if (field.qcode === qcode) {
            showSection(i);
            setTimeout(() => {
              const group = document.getElementById('group-' + qcode);
              if (group) group.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
            toggleAnswerSummary(); // Collapse summary
            return;
          }
        }
      }
    }

    function updateProgress() {
      const pct = Math.round(((state.currentSection + 1) / SECTIONS.length) * 100);
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressText').textContent = pct;
    }

    // ============================================================
    // ANSWER SUMMARY BOX
    // ============================================================
    function toggleAnswerSummary() {
      const summary = document.getElementById('answerSummary');
      summary.classList.toggle('collapsed');
    }

    function updateAnswerSummary() {
      const content = document.getElementById('answerSummaryContent');
      const entries = Object.entries(state.formData).filter(([k, v]) => v && (Array.isArray(v) ? v.length > 0 : true));
      
      document.getElementById('answerCount').textContent = entries.length;
      
      if (entries.length === 0) {
        content.innerHTML = '<div class="no-answers">' + t('summary.empty') + '</div>';
        return;
      }
      
      content.innerHTML = entries.map(([qcode, value]) => {
        let displayValue = value;
        if (Array.isArray(value)) {
          displayValue = value.map(v => t(v)).join(', ');
        } else if (L[value]) {
          displayValue = t(value);
        }
        return `<div class="answer-item" onclick="goToQuestion('${qcode}')">
          <span class="answer-item-q">${t(qcode)}</span>
          <span class="answer-item-a">${displayValue}</span>
          <span class="answer-item-edit">✏️</span>
        </div>`;
      }).join('');
    }

    // ============================================================
    // FHIR R5 QuestionnaireResponse GENERATION
    // ============================================================
    function generateFHIRResponse() {
      return {
        resourceType: "QuestionnaireResponse",
        questionnaire: "https://anamnese-suite.local/fhir/Questionnaire/anamnese-suite|1.0.0",
        status: "completed",
        authored: new Date().toISOString(),
        item: Object.entries(state.formData).filter(([k, v]) => v).map(([qcode, value]) => ({
          linkId: qcode,
          answer: Array.isArray(value) 
            ? value.map(v => ({ valueString: v }))
            : [typeof value === 'boolean' ? { valueBoolean: value } :
               /^\d{4}-\d{2}-\d{2}$/.test(value) ? { valueDate: value } :
               { valueString: String(value) }]
        }))
      };
    }

    // ============================================================
    // EXPORT FUNCTIONS
    // ============================================================
    function showExportModal() {
      document.getElementById('exportModal').classList.remove('hidden');
      if (!('NDEFReader' in window)) {
        document.getElementById('nfcButton').disabled = true;
        document.getElementById('nfcStatusText').textContent = t('nfc.unavailable') || 'NFC nicht verfügbar';
      }
    }

    function cancelExport() {
      document.getElementById('exportModal').classList.add('hidden');
    }

    async function exportNFC() {
      const response = generateFHIRResponse();
      const json = JSON.stringify(response);
      const size = new Blob([json]).size;
      
      if (size > 4000) {
        alert(t('nfc.tooLarge') + ' (' + size + ' Bytes)');
        return;
      }
      
      try {
        if ('NDEFReader' in window) {
          const ndef = new NDEFReader();
          await ndef.write({ records: [{ recordType: "mime", mediaType: "application/json", data: json }] });
          document.getElementById('nfcStatusText').textContent = '✓ ' + (t('nfc.success') || 'Übertragung erfolgreich!');
          setTimeout(wipeData, 2000);
        }
      } catch (e) {
        document.getElementById('nfcStatusText').textContent = (t('nfc.error') || 'Fehler') + ': ' + e.message;
      }
    }

    function exportQR() {
      const response = generateFHIRResponse();
      const json = JSON.stringify(response);
      alert('QR-Code Funktion: Daten bereit (' + json.length + ' Zeichen)\n\nIn Produktion würde hier ein QR-Code generiert.');
    }

    function downloadJSON() {
      const response = generateFHIRResponse();
      const blob = new Blob([JSON.stringify(response, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'anamnese-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      URL.revokeObjectURL(url);
      setTimeout(wipeData, 1000);
    }

    // ============================================================
    // SECURITY: TIMEOUT & WIPE
    // ============================================================
    function setupInactivityTimer() {
      ['mousedown', 'keydown', 'touchstart', 'scroll'].forEach(e => document.addEventListener(e, resetTimeout));
      resetTimeout();
    }

    function resetTimeout() {
      clearTimeout(inactivityTimer);
      clearInterval(countdownTimer);
      document.getElementById('timeoutWarning').classList.add('hidden');
      countdownValue = 60;
      inactivityTimer = setTimeout(showTimeoutWarning, TIMEOUT_MS);
    }

    function showTimeoutWarning() {
      document.getElementById('timeoutWarning').classList.remove('hidden');
      countdownTimer = setInterval(() => {
        countdownValue--;
        document.getElementById('timeoutCounter').textContent = countdownValue;
        if (countdownValue <= 0) wipeData();
      }, 1000);
    }

    function wipeData() {
      state = { currentSection: 0, language: state.language, formData: {}, isConsentGiven: false, isPediatric: false };
      buildSections();
      document.getElementById('exportModal').classList.add('hidden');
      document.getElementById('answerSummary').classList.add('hidden');
      document.getElementById('mainContainer').style.display = 'none';
      document.getElementById('consentModal').classList.remove('hidden');
      document.getElementById('timeoutWarning').classList.add('hidden');
      clearInterval(countdownTimer);
      updateAnswerSummary();
      alert(t('security.dataWiped') || 'Daten wurden aus Sicherheitsgründen gelöscht.');
    }

    // ============================================================
    // VALIDATION FUNCTIONS
    // ============================================================
    function validateSection(sectionIdx) {
      const section = SECTIONS[sectionIdx];
      let isValid = true;
      let firstInvalidField = null;

      section.fields.forEach(field => {
        const group = document.getElementById('group-' + field.qcode);
        if (!group) return;
        
        // Skip hidden fields
        if (group.style.display === 'none') return;
        
        // Clear previous errors
        group.classList.remove('invalid');
        const existingError = group.querySelector('.error-message');
        if (existingError) existingError.remove();
        
        if (field.required) {
          const value = state.formData[field.qcode];
          let errorMessage = null;
          
          // Check if field is empty
          if (!value || (Array.isArray(value) && value.length === 0)) {
            errorMessage = t('validation.required');
            isValid = false;
          }
          
          // Additional validation for name fields (q0000, q0001)
          if (value && (field.qcode === 'q0000' || field.qcode === 'q0001')) {
            // Check minimum 3 characters
            if (value.length < 3) {
              errorMessage = t('validation.nameMin3');
              isValid = false;
            }
            // Check only letters (including international characters)
            else if (!/^[\p{L}\s\-']+$/u.test(value)) {
              errorMessage = t('validation.nameLettersOnly');
              isValid = false;
            }
          }
          
          // Email validation (if field is email type)
          if (value && field.type === 'email') {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(value)) {
              errorMessage = t('validation.emailInvalid');
              isValid = false;
            }
          }
          
          if (errorMessage) {
            group.classList.add('invalid');
            const errorEl = document.createElement('div');
            errorEl.className = 'error-message';
            errorEl.textContent = errorMessage;
            group.appendChild(errorEl);
            
            if (!firstInvalidField) {
              firstInvalidField = group;
            }
          }
        }
      });
      
      // Scroll to first invalid field
      if (firstInvalidField) {
        firstInvalidField.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      
      return isValid;
    }

    // ============================================================
    // SAVE & RESTORE FUNCTIONS (GDPR Art. 6(1)(a) - Consent)
    // ============================================================
    const STORAGE_KEY = 'anamnese_draft';
    const BASE_DATA_KEY = 'anamnese_basedata';

    function showDataPanel(mode) {
      if (mode === 'save') {
        saveFormData();
      } else if (mode === 'restore') {
        restoreFormData();
      }
    }

    function saveFormData() {
      try {
        const dataToSave = {
          formData: state.formData,
          currentSection: state.currentSection,
          language: state.language,
          timestamp: new Date().toISOString()
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
        alert(t('save.success') || 'Daten erfolgreich gespeichert');
      } catch (e) {
        console.error('Save error:', e);
        alert('Speichern fehlgeschlagen: ' + e.message);
      }
    }

    function restoreFormData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) {
          alert(t('save.noData') || 'Keine gespeicherten Daten gefunden');
          return;
        }
        const data = JSON.parse(saved);
        state.formData = data.formData || {};
        state.currentSection = data.currentSection || 0;
        
        buildSections();
        showSection(state.currentSection);
        updateAnswerSummary();
        
        // Show answer summary
        document.getElementById('answerSummary').classList.remove('hidden');
        
        alert(t('save.restored') || 'Gespeicherte Daten wiederhergestellt');
      } catch (e) {
        console.error('Restore error:', e);
        alert('Wiederherstellen fehlgeschlagen: ' + e.message);
      }
    }

    function saveBaseData() {
      try {
        // Only save base data fields (q0000 - q0003)
        const baseData = {
          q0000: state.formData['q0000'] || '',
          q0001: state.formData['q0001'] || '',
          q0002: state.formData['q0002'] || '',
          q0003: state.formData['q0003'] || ''
        };
        localStorage.setItem(BASE_DATA_KEY, JSON.stringify(baseData));
        alert(t('save.baseDataSaved') || 'Stammdaten gespeichert');
      } catch (e) {
        console.error('Save base data error:', e);
        alert('Speichern fehlgeschlagen: ' + e.message);
      }
    }

    function loadBaseData() {
      try {
        const saved = localStorage.getItem(BASE_DATA_KEY);
        if (!saved) {
          alert(t('save.noData') || 'Keine Stammdaten gefunden');
          return;
        }
        const baseData = JSON.parse(saved);
        
        // Merge base data into current form data
        Object.assign(state.formData, baseData);
        
        buildSections();
        showSection(0);
        updateAnswerSummary();
        
        alert(t('save.restored') || 'Stammdaten geladen');
      } catch (e) {
        console.error('Load base data error:', e);
        alert('Laden fehlgeschlagen: ' + e.message);
      }
    }

    function resetForm() {
      if (confirm(t('confirm.reset') || 'Möchten Sie wirklich alle Daten löschen und von vorne beginnen?')) {
        state.formData = {};
        state.currentSection = 0;
        buildSections();
        showSection(0);
        updateAnswerSummary();
        document.getElementById('answerSummary').classList.add('hidden');
        window.scrollTo(0, 0);
      }
    }

    // ============================================================
    // SPEECH-TO-TEXT (Web Speech API - Cross-Platform)
    // ============================================================
    let speechRecognition = null;
    let currentVoiceField = null;

    function initSpeechRecognition() {
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        speechRecognition = new SpeechRecognition();
        speechRecognition.continuous = false;
        speechRecognition.interimResults = false;
        
        // Set language based on current UI language
        const langMap = {
          'de': 'de-DE', 'en': 'en-US', 'tr': 'tr-TR', 'ru': 'ru-RU',
          'ar': 'ar-SA', 'ku': 'ku-TR', 'pl': 'pl-PL', 'ro': 'ro-RO',
          'it': 'it-IT', 'fr': 'fr-FR', 'es': 'es-ES', 'bg': 'bg-BG',
          'nl': 'nl-NL', 'fa': 'fa-IR', 'uk': 'uk-UA'
        };
        speechRecognition.lang = langMap[state.language] || 'de-DE';
        
        speechRecognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          if (currentVoiceField) {
            currentVoiceField.value = transcript;
            currentVoiceField.dispatchEvent(new Event('input', { bubbles: true }));
          }
          hideVoiceStatus();
        };
        
        speechRecognition.onerror = (event) => {
          console.error('Speech recognition error:', event.error);
          hideVoiceStatus();
        };
        
        speechRecognition.onend = () => {
          hideVoiceStatus();
        };
        
        return true;
      }
      return false;
    }

    function startVoiceInput(inputElement) {
      if (!speechRecognition && !initSpeechRecognition()) {
        alert(t('voice.unavailable') || 'Spracherkennung nicht verfügbar');
        return;
      }
      
      // Update language setting
      const langMap = {
        'de': 'de-DE', 'en': 'en-US', 'tr': 'tr-TR', 'ru': 'ru-RU',
        'ar': 'ar-SA', 'ku': 'ku-TR', 'pl': 'pl-PL', 'ro': 'ro-RO',
        'it': 'it-IT', 'fr': 'fr-FR', 'es': 'es-ES', 'bg': 'bg-BG',
        'nl': 'nl-NL', 'fa': 'fa-IR', 'uk': 'uk-UA'
      };
      speechRecognition.lang = langMap[state.language] || 'de-DE';
      
      currentVoiceField = inputElement;
      showVoiceStatus();
      
      try {
        speechRecognition.start();
      } catch (e) {
        console.error('Speech start error:', e);
        hideVoiceStatus();
      }
    }

    function showVoiceStatus() {
      document.getElementById('voiceStatus').classList.remove('hidden');
    }

    function hideVoiceStatus() {
      document.getElementById('voiceStatus').classList.add('hidden');
      currentVoiceField = null;
    }

    // ============================================================
    // MEDICAL DICTIONARY FOR INTELLIGENT ANSWER ASSIGNMENT
    // ============================================================
    const MEDICAL_DICTIONARY = {
      // Symptoms mapped to Q-codes
      'kopfschmerzen': { qcode: 'q2000', value: 'q2000.neuro' },
      'headache': { qcode: 'q2000', value: 'q2000.neuro' },
      'bauchschmerzen': { qcode: 'q2000', value: 'q2000.gi' },
      'stomach pain': { qcode: 'q2000', value: 'q2000.gi' },
      'rückenschmerzen': { qcode: 'q2000', value: 'q2000.msk' },
      'back pain': { qcode: 'q2000', value: 'q2000.msk' },
      'husten': { qcode: 'q2000', value: 'q2000.resp' },
      'cough': { qcode: 'q2000', value: 'q2000.resp' },
      'atemnot': { qcode: 'q2000', value: 'q2000.resp' },
      'shortness of breath': { qcode: 'q2000', value: 'q2000.resp' },
      'brustschmerzen': { qcode: 'q2000', value: 'q2000.cardio' },
      'chest pain': { qcode: 'q2000', value: 'q2000.cardio' },
      'herzrasen': { qcode: 'q2000', value: 'q2000.cardio' },
      'palpitations': { qcode: 'q2000', value: 'q2000.cardio' },
      'schwindel': { qcode: 'q2000', value: 'q2000.neuro' },
      'dizziness': { qcode: 'q2000', value: 'q2000.neuro' },
      'fieber': { qcode: 'q1005', value: 'q1005.fever' },
      'fever': { qcode: 'q1005', value: 'q1005.fever' },
      'müdigkeit': { qcode: 'q1005', value: 'q1005.fatigue' },
      'fatigue': { qcode: 'q1005', value: 'q1005.fatigue' },
      'nachtschweiß': { qcode: 'q1005', value: 'q1005.nightsweats' },
      'night sweats': { qcode: 'q1005', value: 'q1005.nightsweats' },
      'gewichtsverlust': { qcode: 'q1005', value: 'q1005.weightloss' },
      'weight loss': { qcode: 'q1005', value: 'q1005.weightloss' },
      // Yes/No answers
      'ja': { value: 'yes' },
      'yes': { value: 'yes' },
      'nein': { value: 'no' },
      'no': { value: 'no' }
    };

    function analyzeSpokenText(text, qcode) {
      const words = text.toLowerCase().split(/\s+/);
      
      for (const word of words) {
        if (MEDICAL_DICTIONARY[word]) {
          const match = MEDICAL_DICTIONARY[word];
          
          // If the match has a qcode, it's a symptom that can be auto-assigned
          if (match.qcode) {
            // Handle checkbox fields
            const currentValues = state.formData[match.qcode] || [];
            if (!currentValues.includes(match.value)) {
              currentValues.push(match.value);
              state.formData[match.qcode] = currentValues;
            }
          } else if (match.value && qcode) {
            // Simple value assignment (yes/no)
            state.formData[qcode] = match.value;
          }
        }
      }
      
      updateAnswerSummary();
      buildSections();
    }
  </script>
